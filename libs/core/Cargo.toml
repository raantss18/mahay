[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/rfd", "vendor/arboard", "vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# internal: add each crate here as `mahay-<name> = { path = "crates/<name>" }`
mahay-ai-core = { path = "crates/ai-core" }
mahay-pdf = { path = "crates/pdf", version = "=0.1.0" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
thiserror = "2"
mahay-atomic = { path = "crates/atomic" }
mahay-cms = { path = "crates/cms" }
mahay-docpath = { path = "crates/docpath" }
mahay-print = { path = "crates/print" }
mahay-quit = { path = "crates/quit" }
mahay-settings = { path = "crates/settings" }
mahay-ui = { path = "crates/ui" }
mahay-update = { path = "crates/update" }
mahay-about = { path = "crates/about" }
egui = { version = "0.36", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mahay_pdf_unicode_fixtures)"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[patch.crates-io]
krilla = { path = "vendor/krilla" }

hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
