[package]
name = "mahay-android"
description = "Android glue shared by every Mahay app: logging, data folders, document pickers and app launch through the MahayActivity Java shell."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# No `[lints] workspace = true`: the JNI entry points need `#[unsafe(no_mangle)]`, which the
# workspace's `unsafe_code = "forbid"` would refuse. The unsafe here is limited to those exports
# and to `set_var` before any thread starts.

[features]
# `EguiBridge`: soft keyboard and clipboard for an eframe app.
egui = ["dep:egui", "dep:mahay-about", "dep:mahay-update", "dep:mahay-feedback"]
# Mahay HUB: the JNI entry points of its background update job.
hub = ["dep:mahay-update"]

[target.'cfg(target_os = "android")'.dependencies]
egui = { workspace = true, optional = true }
mahay-about = { workspace = true, optional = true }
mahay-update = { workspace = true, optional = true }
mahay-feedback = { workspace = true, optional = true }
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = { version = "0.15", default-features = false }
jni = "0.21"
log = "0.4"
serde_json = { workspace = true }

[dev-dependencies]
# The `cleanup` module's tests run on the host.
log = "0.4"
