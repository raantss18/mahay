[package]
name = "hetsika-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hetsika-time = { workspace = true }
hetsika-frame = { workspace = true }
hetsika-color = { workspace = true }
hetsika-media = { workspace = true }
hetsika-project = { workspace = true }
hetsika-render = { workspace = true }
hetsika-audio-dsp = { workspace = true }
hetsika-geom = { workspace = true }
hetsika-text = { workspace = true }
hetsika-isobmff = { workspace = true }
hetsika-prores = { workspace = true }
hetsika-dnx = { workspace = true }
hetsika-apv = { workspace = true }
hetsika-mxf = { workspace = true }
hetsika-aac = { workspace = true }
hetsika-flac = { workspace = true }
hetsika-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
hetsika-testkit = { workspace = true }
hetsika-codecs = { workspace = true }
