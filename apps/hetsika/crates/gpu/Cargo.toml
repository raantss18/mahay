[package]
name = "hetsika-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hetsika-color = { workspace = true }
hetsika-frame = { workspace = true }
hetsika-geom = { workspace = true }
hetsika-project = { workspace = true }
hetsika-render = { workspace = true }
hetsika-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
hetsika-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
hetsika-media = { workspace = true }
hetsika-time = { workspace = true }
