[package]
name = "hetsika-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hetsika-time = { workspace = true }
hetsika-color = { workspace = true }
hetsika-frame = { workspace = true }
hetsika-media = { workspace = true }
hetsika-avi = { workspace = true }
hetsika-isobmff = { workspace = true }
hetsika-matroska = { workspace = true }
hetsika-mxf = { workspace = true }
hetsika-mpegts = { workspace = true }
hetsika-mpeg2v = { workspace = true }
hetsika-ac3 = { workspace = true }
hetsika-mpa = { workspace = true }
hetsika-ogg = { workspace = true }
hetsika-bitstream = { workspace = true }
hetsika-h264 = { workspace = true }
hetsika-hevc = { workspace = true }
hetsika-vp8 = { workspace = true }
hetsika-vp9 = { workspace = true }
hetsika-prores = { workspace = true }
hetsika-dnx = { workspace = true }
hetsika-av1 = { workspace = true }
hetsika-apv = { workspace = true }
hetsika-aac = { workspace = true }
hetsika-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
hetsika-testkit = { workspace = true }
serde_json = { workspace = true }
