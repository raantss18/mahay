[package]
name = "hetsika-engine"
description = "Hetsika engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["hetsika-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["hetsika-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["hetsika-tts/kokoro", "speech-download"]

[dependencies]
hetsika-time = { workspace = true }
hetsika-geom = { workspace = true }
hetsika-color = { workspace = true }
hetsika-frame = { workspace = true }
hetsika-media = { workspace = true }
hetsika-codecs = { workspace = true }
hetsika-project = { workspace = true }
hetsika-edit = { workspace = true }
hetsika-render = { workspace = true }
hetsika-scopes = { workspace = true }
hetsika-text = { workspace = true }
hetsika-audio-dsp = { workspace = true }
hetsika-export = { workspace = true }
hetsika-mxf = { workspace = true }
hetsika-format = { workspace = true }
hetsika-interchange = { workspace = true }
hetsika-captions = { workspace = true }
hetsika-speech = { workspace = true }
hetsika-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
mahay-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
hetsika-testkit = { workspace = true }
hetsika-dng = { workspace = true, features = ["writer"] }
hetsika-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
