[package]
name = "hetsika-cli"
description = "Hetsika headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "hetsika-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["hetsika-engine/whisper", "hetsika-engine/speech-download"]

[dependencies]
hetsika-engine = { workspace = true }
hetsika-export = { workspace = true }
hetsika-project = { workspace = true }
hetsika-render = { workspace = true }
hetsika-time = { workspace = true }
hetsika-gpu = { workspace = true }
hetsika-media = { workspace = true }
hetsika-codecs = { workspace = true }
hetsika-platform = { workspace = true }
hetsika-mxf = { workspace = true }
hetsika-mpegts = { workspace = true }
hetsika-ogg = { workspace = true }
hetsika-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
hetsika-testkit = { workspace = true }
