[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/pejy", "apps/pejy-cli", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# Shared writer; the immutable revision must be published before this consumer.
mahay-pdf = { path = "../../libs/core/crates/pdf", version = "=0.1.0", default-features = false }
# internal
pejy-geom = { path = "crates/geom" }
pejy-color = { path = "crates/color" }
pejy-doc = { path = "crates/doc" }
pejy-fonts = { path = "crates/fonts" }
pejy-compose = { path = "crates/compose" }
pejy-images = { path = "crates/images" }
pejy-render = { path = "crates/render" }
pejy-pdf = { path = "crates/pdf" }
pejy-idml = { path = "crates/idml" }
pejy-epub = { path = "crates/epub" }
pejy-pptx = { path = "crates/pptx" }
pejy-textimport = { path = "crates/textimport" }
pejy-format = { path = "crates/format" }
pejy-tools = { path = "crates/tools" }
pejy-engine = { path = "crates/engine" }
pejy-ui-egui = { path = "crates/ui-egui" }
pejy-mcp = { path = "crates/mcp" }
pejy-testkit = { path = "crates/testkit" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
fancy-regex = "0.19.2"
tempfile = "3"
same-file = "1.0.6"

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "=0.8.1"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
hayro = "0.7"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# INDD/INDT → IDML conversion for File › Open: raantss18/indd-utils, tracking its main branch
# (MIT OR Apache-2.0, no dependencies, builds for wasm).
indd = { git = "https://github.com/storytold/indd-utils", branch = "main" }

# Which paths stored in documents may be followed (mahay-libs).
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }
# Atomic file replacement for saves and exports (mahay-libs).
mahay-atomic = { path = "../../libs/core/crates/atomic", version = "0.1.0" }
# File › Print through the system print spooler (mahay-libs).
mahay-print = { path = "../../libs/core/crates/print", version = "0.1.0" }

# ICC colour management: working spaces, transforms, black point compensation (mahay-libs).
mahay-cms = { path = "../../libs/core/crates/cms", version = "0.1.0" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
mahay-ui = { path = "../../libs/core/crates/ui", version = "0.1.0", features = ["serde"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Opt-in cancelable macOS termination on the pinned winit 0.30 line.
[patch.crates-io]
# Android backends through mahay-android (document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }
winit = { git = "https://github.com/skylartaylor/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }
krilla = { path = "../../libs/core/vendor/krilla", version = "=0.8.2" }
# The hayro crates from taratasy's vendor/ directory, with the patches its README lists.
hayro = { path = "../../libs/core/vendor/hayro" }
hayro-interpret = { path = "../../libs/core/vendor/hayro-interpret" }
hayro-syntax = { path = "../../libs/core/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../../libs/core/vendor/hayro-jbig2" }

# Android release: size first, whole-program LTO, no symbols.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
