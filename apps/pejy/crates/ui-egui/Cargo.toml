[package]
name = "pejy-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pejy egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
mahay-about = { path = "../../../../libs/core/crates/about" }
mahay-ui = { workspace = true }
pejy-geom = { workspace = true }
pejy-color = { workspace = true }
pejy-doc = { workspace = true }
pejy-fonts = { workspace = true }
pejy-compose = { workspace = true }
pejy-render = { workspace = true }
pejy-tools = { workspace = true }
pejy-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pejy-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
pejy-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
