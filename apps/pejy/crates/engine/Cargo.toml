[package]
name = "pejy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pejy engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
mahay-print = { workspace = true }
mahay-docpath = { workspace = true }
pejy-images = { workspace = true }
pejy-geom = { workspace = true }
pejy-color = { workspace = true }
pejy-doc = { workspace = true }
pejy-fonts = { workspace = true }
pejy-compose = { workspace = true }
pejy-render = { workspace = true }
pejy-format = { workspace = true }
pejy-epub = { workspace = true }
pejy-pptx = { workspace = true }
pejy-textimport = { workspace = true }
pejy-pdf = { workspace = true }
pejy-tools = { workspace = true }
pejy-idml = { workspace = true }
indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mahay-atomic = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
pejy-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
