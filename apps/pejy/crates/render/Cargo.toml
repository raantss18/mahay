[package]
name = "pejy-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pejy renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
pejy-geom = { workspace = true }
pejy-color = { workspace = true }
pejy-doc = { workspace = true }
pejy-fonts = { workspace = true }
pejy-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
pejy-images = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
