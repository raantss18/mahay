[package]
name = "tsipika-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsipika engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts tsipika-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`tsipika_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["tsipika-text/bundled-fonts"]

[dependencies]
# Which paths stored in documents may be opened.
mahay-docpath = { workspace = true }
tsipika-geom = { workspace = true }
tsipika-color = { workspace = true }
tsipika-doc = { workspace = true }
tsipika-tools = { workspace = true }
tsipika-text = { workspace = true }
tsipika-render = { workspace = true }
tsipika-pathops = { workspace = true }
tsipika-brush = { workspace = true }
tsipika-trace = { workspace = true }
tsipika-svg = { workspace = true }
tsipika-format = { workspace = true }
tsipika-pdf = { workspace = true }
tsipika-cad = { workspace = true }
tsipika-eps = { workspace = true }
tsipika-metafile = { workspace = true }
tsipika-plugins = { workspace = true }
tsipika-affinity = { workspace = true }
tsipika-scriptcheck = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tsipika-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
tsipika-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
tsipika-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
