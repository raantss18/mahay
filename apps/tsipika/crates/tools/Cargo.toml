[package]
name = "tsipika-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsipika tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
tsipika-geom = { workspace = true }
tsipika-color = { workspace = true }
tsipika-doc = { workspace = true }
tsipika-pathops = { workspace = true }
tsipika-effects = { workspace = true }
tsipika-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
tsipika-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
