[package]
name = "tsipika-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsipika egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
mahay-ui = { workspace = true }
tsipika-geom = { workspace = true }
tsipika-color = { workspace = true }
tsipika-doc = { workspace = true }
tsipika-brush = { workspace = true }
tsipika-render = { workspace = true }
tsipika-text = { workspace = true }
tsipika-tools = { workspace = true }
tsipika-engine = { workspace = true }
tsipika-svg = { workspace = true }
tsipika-effects = { workspace = true }
tsipika-three-d = { workspace = true }
tsipika-plugins = { workspace = true }
tsipika-pdf = { workspace = true }
tsipika-cad = { workspace = true }
tsipika-eps = { workspace = true }
tsipika-format = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `now_ms` (src/lib.rs) reads the page's `performance.now()` with this crate in the web build. It is
# MIT OR Apache-2.0 and already in the build through eframe.
web-time = "1"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
tsipika-testkit = { workspace = true }
# A variable font built in code (no font file is committed).
tsipika-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
