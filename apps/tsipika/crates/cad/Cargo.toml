[package]
name = "tsipika-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsipika CAD interchange: a hand-written ASCII DXF writer (R12 to 2018)"

[lints]
workspace = true

[dependencies]
tsipika-geom = { workspace = true }
tsipika-color = { workspace = true }
tsipika-doc = { workspace = true }
tsipika-effects = { workspace = true }
tsipika-brush = { workspace = true }
tsipika-pathops = { workspace = true }
tsipika-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
tsipika-text = { workspace = true, features = ["bundled-fonts"] }
