[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# internal
feo-time = { path = "crates/time" }
feo-audio-io = { path = "crates/audio-io" }
feo-midi = { path = "crates/midi" }
feo-video = { path = "crates/video" }
feo-dsp = { path = "crates/dsp" }
feo-clap-host = { path = "crates/clap-host" }
feo-vst3-host = { path = "crates/vst3-host" }
feo-au-host = { path = "crates/au-host" }
feo-model = { path = "crates/model" }
feo-mix = { path = "crates/mix" }
feo-engine = { path = "crates/engine" }
feo-playback = { path = "crates/playback" }
feo-automation = { path = "crates/automation" }
feo-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"

# audio
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
rustfft = "6"
# Session bundles (one file holding a session and its audio, for the browser): stored entries only.
zip = { version = "9", default-features = false }
cpal = "0.16"

# Which file paths stored in a session may be opened.
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }

# ui
mahay-ui = { path = "../../libs/core/crates/ui", version = "0.1.0", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# Android backends through mahay-android (document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }

# Android release: size first, whole-program LTO, no symbols.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
