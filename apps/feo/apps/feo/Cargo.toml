[package]
name = "feo"
description = "Feo desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "feo"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see feo-playback's `asio` feature).
asio = ["feo-playback/asio"]

[dependencies]
mahay-about = { path = "../../../../libs/core/crates/about" }
feo-engine.workspace = true
feo-ui-egui.workspace = true
feo-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for feo.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
