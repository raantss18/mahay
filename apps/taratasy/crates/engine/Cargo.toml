[package]
name = "taratasy-engine"
description = "Taratasy engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mahay-docpath = { workspace = true }
taratasy-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
taratasy-render = { workspace = true }
taratasy-cos = { workspace = true }
taratasy-organize = { workspace = true }
taratasy-annot = { workspace = true }
taratasy-forms = { workspace = true }
taratasy-xfa = { workspace = true }
taratasy-edit = { workspace = true }
taratasy-audit = { workspace = true }
taratasy-redact = { workspace = true }
taratasy-print = { workspace = true }
taratasy-xfdf = { workspace = true }
taratasy-sign = { workspace = true }
taratasy-optimize = { workspace = true }
taratasy-a11y = { workspace = true }
taratasy-ocr = { workspace = true }
taratasy-js = { workspace = true }
taratasy-compare = { workspace = true }
taratasy-preflight = { workspace = true }
taratasy-export = { workspace = true }
taratasy-fonts = { workspace = true }
taratasy-create = { workspace = true }
taratasy-model = { workspace = true }
taratasy-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
