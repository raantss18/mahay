[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/taratasy", "apps/taratasy-cli", "xtask"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
mahay-ui = { path = "../../libs/core/crates/ui", version = "0.1.0", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
mahay-quit = { path = "../../libs/core/crates/quit", version = "0.1.0" }
# Shared system spooler; document composition remains in taratasy-print.
mahay-print = { path = "../../libs/core/crates/print", version = "0.1.0" }
# Whether a path stored in a document may be opened (GoToR link targets).
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }
# internal
taratasy-geom = { path = "crates/geom", version = "0.2.1" }
taratasy-filters = { path = "crates/filters", version = "0.2.1" }
taratasy-cos = { path = "crates/cos", version = "0.2.1" }
taratasy-crypt = { path = "crates/crypt", version = "0.2.1" }
taratasy-organize = { path = "crates/organize", version = "0.2.1" }
taratasy-measure = { path = "crates/measure", version = "0.2.1" }
taratasy-annot = { path = "crates/annot", version = "0.2.1" }
taratasy-audit = { path = "crates/audit", version = "0.2.1" }
taratasy-fonts = { path = "crates/fonts", version = "0.2.1" }
taratasy-model = { path = "crates/model", version = "0.2.1" }
taratasy-content = { path = "crates/content", version = "0.2.1" }
taratasy-redact = { path = "crates/redact", version = "0.2.1" }
taratasy-print = { path = "crates/print", version = "0.2.1" }
taratasy-xfdf = { path = "crates/xfdf", version = "0.2.1" }
taratasy-sign = { path = "crates/sign", version = "0.2.1" }
taratasy-optimize = { path = "crates/optimize", version = "0.2.1" }
taratasy-a11y = { path = "crates/a11y", version = "0.2.1" }
taratasy-oracle = { path = "crates/oracle", version = "0.2.1" }
taratasy-testkit = { path = "crates/testkit", version = "0.2.1" }
taratasy-ocr = { path = "crates/ocr", version = "0.2.1" }
taratasy-js = { path = "crates/js", version = "0.2.1" }
taratasy-compare = { path = "crates/compare", version = "0.2.1" }
taratasy-preflight = { path = "crates/preflight", version = "0.2.1" }
taratasy-export = { path = "crates/export", version = "0.2.1" }
taratasy-edit = { path = "crates/edit", version = "0.2.1" }
taratasy-create = { path = "crates/create", version = "0.2.1" }
taratasy-forms = { path = "crates/forms", version = "0.2.1" }
taratasy-xfa = { path = "crates/xfa", version = "0.2.1" }
taratasy-render = { path = "crates/render", version = "0.2.1" }
taratasy-engine = { path = "crates/engine", version = "0.2.1" }
taratasy-platform = { path = "crates/platform", version = "0.2.1" }
taratasy-ui-egui = { path = "crates/ui-egui", version = "0.2.1" }
taratasy-automation = { path = "crates/automation", version = "0.2.1", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.low-disk]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
# Adds an Android backend (Storage Access Framework through mahay-android); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
# Adds an Android text backend through mahay-android; desktop unchanged.
arboard = { path = "../../libs/core/vendor/arboard" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }

# Android release: whole-program LTO and no symbols, for the smallest .so.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# Size first (about a quarter smaller than opt-level 3); hot loops stay at 3 below.
opt-level = "s"

[profile.android.package.taratasy-render]
opt-level = 3

[profile.android.package.hayro]
opt-level = 3

[profile.android.package.hayro-interpret]
opt-level = 3

[profile.android.package.hayro-syntax]
opt-level = 3

[profile.android.package.hayro-jbig2]
opt-level = 3

[profile.android.package.taratasy-filters]
opt-level = 3
