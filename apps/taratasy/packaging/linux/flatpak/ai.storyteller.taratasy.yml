# Flatpak manifest for Taratasy, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.taratasy.yml
#   flatpak run ai.storyteller.taratasy
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from ai.storyteller.taratasy.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: ai.storyteller.taratasy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: taratasy
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Downloads, where PDFs usually live, are granted so files
  # passed by path (the command line, Open Recent, "Save" next to the original) work there.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted: network (Flatpak installs update through flatpak, so Help ▸ Check
  # for updates reports that GitHub is unreachable; the optional --control channel listens on
  # 127.0.0.1 inside the sandbox) and home/host filesystem access. No CUPS socket either: printing
  # runs the `lp` command (crates/print), which the freedesktop runtime doesn't ship, so Print
  # reports that the spooler is unavailable until it goes through the print portal.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: taratasy
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/taratasy/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p taratasy
      - install -Dm755 target/release/taratasy /app/bin/taratasy
      - install -Dm644 packaging/linux/ai.storyteller.taratasy.desktop /app/share/applications/ai.storyteller.taratasy.desktop
      - install -Dm644 packaging/linux/ai.storyteller.taratasy.mime.xml /app/share/mime/packages/ai.storyteller.taratasy.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.taratasy.metainfo.xml.in > /app/share/metainfo/ai.storyteller.taratasy.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
