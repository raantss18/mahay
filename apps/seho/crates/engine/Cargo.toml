[package]
name = "seho-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seho engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
seho-geom = { workspace = true }
seho-color = { workspace = true }
seho-model = { workspace = true }
seho-fonts = { workspace = true }
seho-text = { workspace = true }
seho-render = { workspace = true }
seho-pdf = { workspace = true }
seho-format = { workspace = true }
seho-pptx = { workspace = true }
seho-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
seho-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

