[package]
name = "seho-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seho PDF export (mahay-pdf/Krilla): slides, notes pages and handouts with a selectable text layer, links and bookmarks"

[lints]
workspace = true

[dependencies]
seho-model = { workspace = true }
seho-fonts = { workspace = true }
seho-text = { workspace = true }
seho-render = { workspace = true }
mahay-pdf = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Off the web build, krilla compresses each slide's artwork on a background thread while the next
# slide renders (the same bytes, in parallel). The root patch selects the same pinned
# backend as mahay-pdf; this dependency only enables its native compression feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
krilla = { version = "=0.8.2", features = ["rayon"] }
