[package]
name = "seho-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seho egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
seho-geom = { workspace = true }
seho-color = { workspace = true }
seho-model = { workspace = true }
seho-fonts = { workspace = true }
seho-text = { workspace = true }
seho-render = { workspace = true }
seho-anim = { workspace = true }
seho-engine = { workspace = true }
seho-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
