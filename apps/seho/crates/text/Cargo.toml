[package]
name = "seho-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seho text layout: runs to shaped glyph lines with bullets, indents, spacing, alignment, anchoring, autofit and caret hit testing"

[lints]
workspace = true

[dependencies]
seho-model = { workspace = true }
seho-geom = { workspace = true }
seho-color = { workspace = true }
seho-fonts = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }

# The local clock for date fields (no clock on wasm: fields keep their saved text).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { workspace = true }
