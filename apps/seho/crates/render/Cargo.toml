[package]
name = "seho-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seho renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
seho-geom = { workspace = true }
seho-color = { workspace = true }
seho-metafile = { workspace = true }
seho-model = { workspace = true }
seho-anim = { workspace = true }
seho-fonts = { workspace = true }
seho-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
