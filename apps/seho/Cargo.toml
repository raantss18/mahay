[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/seho", "apps/seho-cli"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# internal
seho-geom = { path = "crates/geom" }
seho-color = { path = "crates/color" }
seho-metafile = { path = "crates/metafile" }
seho-model = { path = "crates/model" }
seho-fonts = { path = "crates/fonts" }
seho-text = { path = "crates/text" }
seho-render = { path = "crates/render" }
seho-pdf = { path = "crates/pdf" }
seho-pptx = { path = "crates/pptx" }
seho-format = { path = "crates/format" }
seho-anim = { path = "crates/anim" }
seho-engine = { path = "crates/engine" }
seho-mcp = { path = "crates/mcp" }
seho-ui-egui = { path = "crates/ui-egui" }
seho-media = { path = "crates/media" }
# codecs (ported from Hetsika, same owner and licence)
seho-bitstream = { path = "crates/bitstream" }
seho-h264 = { path = "crates/h264" }
seho-hevc = { path = "crates/hevc" }
seho-vp9 = { path = "crates/vp9" }
seho-av1 = { path = "crates/av1" }
seho-isobmff = { path = "crates/isobmff" }
seho-matroska = { path = "crates/matroska" }
seho-ogg = { path = "crates/ogg" }
seho-opus = { path = "crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
mahay-pdf = { path = "../../libs/core/crates/pdf", version = "=0.1.0", default-features = false, features = ["write"] }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# Adds an Android backend (Storage Access Framework through mahay-android); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
# Adds an Android text backend through mahay-android; desktop unchanged.
arboard = { path = "../../libs/core/vendor/arboard" }
krilla = { path = "../../libs/core/vendor/krilla", version = "=0.8.2" }

# Android release: whole-program LTO and no symbols, for the smallest .so.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
