[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# default-members

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# internal
drafitra-geom = { path = "crates/geom" }
drafitra-dxf = { path = "crates/dxf" }
drafitra-dwg = { path = "crates/dwg" }
drafitra-color = { path = "crates/color" }
drafitra-doc = { path = "crates/doc" }
drafitra-constraints = { path = "crates/constraints" }
drafitra-fonts = { path = "crates/fonts" }
drafitra-render = { path = "crates/render" }
drafitra-io = { path = "crates/io" }
drafitra-engine = { path = "crates/engine" }
drafitra-ui-egui = { path = "crates/ui-egui" }
drafitra-mcp = { path = "crates/mcp" }
# Which paths stored in a drawing (xrefs, data links) may be opened.
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"

# rendering / formats
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
lyon_tessellation = "1.0.22"
skrifa = "0.47"
# Text shaping (OpenType GSUB/GPOS, HarfBuzz port on read-fonts; the version egui's epaint uses)
# and the Unicode Bidirectional Algorithm for right-to-left drawing text.
harfrust = "0.12"
unicode-bidi = "0.3.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
encoding_rs = "0.8.35"
# XML for the SVG reader (streaming parser, no entity expansion beyond the five predefined ones)
quick-xml = "0.41"

# ui
mahay-ui = { path = "../../libs/core/crates/ui", version = "0.1.0", features = ["serde"] }
egui = "0.36"
egui_kittest = "0.36"
eframe = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# Android backends through mahay-android (document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }

# Android release: size first, whole-program LTO, no symbols.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
