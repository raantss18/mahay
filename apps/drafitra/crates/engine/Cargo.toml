[package]
name = "drafitra-engine"
description = "Drafitra engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
drafitra-geom = { workspace = true }
drafitra-color = { workspace = true }
drafitra-doc = { workspace = true }
drafitra-dxf = { workspace = true }
drafitra-constraints = { workspace = true }
drafitra-fonts = { workspace = true }
drafitra-render = { workspace = true }
mahay-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
drafitra-io = { workspace = true }
