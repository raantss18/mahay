[package]
name = "hazavana-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hazavana engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
mahay-docpath = { workspace = true }
hazavana-geom = { workspace = true }
hazavana-color = { workspace = true }
hazavana-raster = { workspace = true }
hazavana-develop = { workspace = true }
hazavana-scenes = { workspace = true }
hazavana-pipeline = { workspace = true }
hazavana-gpu = { workspace = true }
hazavana-catalog = { workspace = true }
web-time = { workspace = true }
hazavana-preview = { workspace = true }
hazavana-codecs = { workspace = true }
hazavana-raw = { workspace = true }
hazavana-denoise-core = { workspace = true }
hazavana-denoise = { workspace = true, optional = true }
hazavana-meta = { workspace = true }
hazavana-lensdb = { workspace = true }
hazavana-faces = { workspace = true }
miniz_oxide = { workspace = true }
hazavana-merge = { workspace = true }
hazavana-geocode = { workspace = true }
hazavana-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
hazavana-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hazavana-fetch = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:hazavana-segment"]
denoise = ["dep:hazavana-denoise", "hazavana-denoise/runtime", "hazavana-gpu/denoise"]
rawnind-model = ["denoise", "hazavana-denoise/rawnind-model", "hazavana-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
hazavana-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
hazavana-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
hazavana-tiff = { workspace = true }
