[package]
name = "hazavana-ui-egui"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
description = "Hazavana egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
mahay-about = { path = "../../../../libs/core/crates/about" }
mahay-ui = { workspace = true }
hazavana-geom = { workspace = true }
hazavana-meta = { workspace = true }
hazavana-color = { workspace = true }
hazavana-raster = { workspace = true }
hazavana-develop = { workspace = true }
hazavana-pipeline = { workspace = true }
hazavana-catalog = { workspace = true }
web-time = { workspace = true }
hazavana-engine = { workspace = true }
hazavana-slideshow = { workspace = true }
hazavana-preview = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
hazavana-testkit = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
hazavana-denoise = { workspace = true, features = ["runtime"] }
hazavana-codecs = { workspace = true }
hazavana-faces = { workspace = true }
hazavana-merge = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
