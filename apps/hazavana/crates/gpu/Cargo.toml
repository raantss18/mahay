[package]
name = "hazavana-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hazavana GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
hazavana-denoise = { workspace = true, optional = true }
hazavana-geom = { workspace = true }
hazavana-color = { workspace = true }
hazavana-raster = { workspace = true }
hazavana-develop = { workspace = true }
hazavana-faces = { workspace = true }
hazavana-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:hazavana-denoise", "hazavana-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
hazavana-testkit = { workspace = true }
hazavana-scenes = { workspace = true }
hazavana-raw = { workspace = true }
