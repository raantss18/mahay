[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
mahay-ui = { path = "../../libs/core/crates/ui", features = ["serde"] }
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }
# internal
hazavana-denoise-core = { path = "crates/denoise-core" }
hazavana-denoise = { path = "crates/denoise", default-features = false }
hazavana-geom = { path = "crates/geom" }
hazavana-faces = { path = "crates/faces" }
hazavana-sysmem = { path = "crates/sysmem" }
hazavana-color = { path = "crates/color" }
hazavana-raster = { path = "crates/raster" }
hazavana-tiff = { path = "crates/tiff" }
hazavana-raw = { path = "crates/raw" }
hazavana-codecs = { path = "crates/codecs" }
hazavana-meta = { path = "crates/meta" }
hazavana-develop = { path = "crates/develop" }
hazavana-lensdb = { path = "crates/lensdb" }
hazavana-inpaint = { path = "crates/inpaint" }
hazavana-scenes = { path = "crates/scenes" }
hazavana-pipeline = { path = "crates/pipeline" }
hazavana-gpu = { path = "crates/gpu" }
hazavana-catalog = { path = "crates/catalog" }
hazavana-preview = { path = "crates/preview" }
hazavana-merge = { path = "crates/merge" }
hazavana-engine = { path = "crates/engine" }
hazavana-ui-egui = { path = "crates/ui-egui" }
hazavana-mcp = { path = "crates/mcp" }
hazavana-fetch = { path = "crates/fetch" }
hazavana-heif = { path = "crates/heif" }
hazavana-segment = { path = "crates/segment" }
hazavana-geocode = { path = "crates/geocode" }
hazavana-slideshow = { path = "crates/slideshow" }
hazavana-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
siphasher = "1"
libc = "0.2" # dev-only: process CPU time in benches
dhat = "0.3" # opt-in heap profiling (hazavana-cli --features dhat-heap) and heap tests; never in product builds

# formats
quick-xml = "0.41"
miniz_oxide = "0.8"

# codecs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }  # Apache-2.0, pure Rust glyph rasterizer (export watermarks)
png = "0.18"
tiff = "0.11"
image-webp = "0.2"
moxcms = { version = "0.9", default-features = false, features = ["lut"] }
jxl-oxide = { version = "0.12", default-features = false }
jixel = "=0.3.4" # BSD-3-Clause OR Apache-2.0, pure-Rust JPEG XL encoder (export; port of libjxl-tiny)
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] } # MIT/Apache-2.0/Zlib lossless JXL encoder (test fixtures only)
ravif = { version = "0.13", default-features = false, features = ["threading"] } # no "asm": it needs nasm (non-Rust)
# HDR AVIF (PQ): ravif fixes the sRGB transfer curve, so HDR files drive its rav1e + avif-serialize directly
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
avif-serialize = "0.8.6"

# gpu (crates/gpu; native backends only, no GL: everything stays pure Rust)
# SAM 3 inference (hazavana-segment). 0.9.2: later releases pull `tokenizers` with the
# Oniguruma C library into candle-core, and the product is pure Rust.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
muda = { version = "0.21", default-features = false } # native menu bar (macOS: objc2/AppKit, pure Rust; no GTK)
# macOS: the profile of the screen showing the window (safe AppKit bindings; muda and wgpu use the same)
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColorSpace", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData"] }
# Linux: the desktop's dark/light setting from the XDG settings portal (Settings ▸ Interface ▸
# Appearance Mode ▸ Auto). Pure Rust; the version accesskit already brings in, pinned to it.
zbus = "=5.19.0"
web-time = "1"

# web (apps/hazavana-web)
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false

# `cargo xtask web`: the browser build. Size matters more than build time: fat LTO, one codegen
# unit, no symbols, abort on panic (wasm32 can't unwind anyway), size-optimized code — except the
# crates that do per-pixel work, which stay at opt-level 3 (opt-level "s"/"z" there costs ~50 %/
# ~130 % render time; measured in docs/web.md → Bundle size).
[profile.web]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.web.package]
hazavana-pipeline = { opt-level = 3 }
hazavana-raster = { opt-level = 3 }
hazavana-color = { opt-level = 3 }
hazavana-develop = { opt-level = 3 }
hazavana-geom = { opt-level = 3 }
hazavana-raw = { opt-level = 3 }
hazavana-codecs = { opt-level = 3 }
hazavana-scenes = { opt-level = 3 }
hazavana-preview = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
png = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }

[patch.crates-io]
# Android backends through mahay-android (document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }

# Android release: size first, whole-program LTO, no symbols.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
