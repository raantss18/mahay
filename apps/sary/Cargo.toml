[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/sary", "apps/sary-cli", "xtask"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
mahay-ui = { path = "../../libs/core/crates/ui", features = ["serde"] }
# internal
sary-geom = { path = "crates/geom" }
sary-color = { path = "crates/color" }
sary-cms = { path = "crates/cms" }
sary-raster = { path = "crates/raster" }
sary-doc = { path = "crates/doc" }
sary-ops = { path = "crates/ops" }
sary-psd = { path = "crates/psd" }
sary-codecs = { path = "crates/codecs" }
sary-raw = { path = "crates/raw" }
sary-affinity = { path = "crates/affinity" }
sary-compose = { path = "crates/compose" }
sary-gpu = { path = "crates/gpu" }
sary-paint = { path = "crates/paint" }
sary-algo = { path = "crates/algo" }
sary-io = { path = "crates/io" }
sary-text = { path = "crates/text" }
sary-vector = { path = "crates/vector" }
sary-format = { path = "crates/format" }
sary-automation = { path = "crates/automation" }
sary-plugins = { path = "crates/plugins" }
sary-engine = { path = "crates/engine" }
sary-ui-egui = { path = "crates/ui-egui" }
sary-testkit = { path = "crates/testkit" }
sary-tablet = { path = "crates/tablet" }
sary-ipp = { path = "crates/ipp" }

# external
mahay-print = { path = "../../libs/core/crates/print" }
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs; the web build's size gate).
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the ~260 test binaries (#2204). CI sets the same through
# CARGO_PROFILE_DEV_DEBUG (and no debuginfo at all for the Windows tests). To inspect locals in a
# debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.sary-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/sary-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for Sary's own crates,
# "s" for dependencies and for the crates that decode files, and 3 for pixel processing (filters
# and compositing). Dependencies stay at "s": at "z" the whole wasm grows (by 0.4 MB, measured).
# panic stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"`
# is for the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Decoding and rasterizing keep their speed.
[profile.wasm-release.package.sary-codecs]
opt-level = "s"
[profile.wasm-release.package.sary-raw]
opt-level = "s"
[profile.wasm-release.package.sary-heif]
opt-level = "s"
[profile.wasm-release.package.sary-vector]
opt-level = "s"

# Large crates off the per-frame and per-pixel paths: the document model, file parsers run once
# per open/save, JSON (settings, presets, control channel), SVG parsing, and shader translation
# (runs when a pipeline is created). "z" keeps the wasm well under the size gate.
[profile.wasm-release.package.sary-doc]
opt-level = "z"
[profile.wasm-release.package.sary-psd]
opt-level = "z"
[profile.wasm-release.package.sary-format]
opt-level = "z"
[profile.wasm-release.package.sary-affinity]
opt-level = "z"
[profile.wasm-release.package.serde_json]
opt-level = "z"
[profile.wasm-release.package.usvg]
opt-level = "z"
[profile.wasm-release.package.naga]
opt-level = "z"

# The browser UI toolkit favors size to stay within the WebAssembly upload budget.
[profile.wasm-release.package.egui]
opt-level = "z"
[profile.wasm-release.package.epaint]
opt-level = "z"
[profile.wasm-release.package.eframe]
opt-level = "z"

# Pixel processing keeps its speed-oriented optimization level, with two exceptions.
# Colour-management transforms are built once and cached (`transform::cached`), so "z" costs
# little runtime. The browser app composites per frame on the GPU (`crates/gpu`, WebGPU/WebGL2),
# so the CPU compositor is not the browser's hot path there; "z" for compose keeps the wasm
# under the 24 MiB gate (measured −122 KB vs opt-level 3). algo's filters run per pixel on
# every interactive filter application; "z" there is the size lever of last resort (−331 KB),
# taken because the gate is enforced in CI: if browser filters feel too slow, restore 3 here
# and reclaim the bytes from a feature-gated decoder instead.
[profile.wasm-release.package.sary-raster]
opt-level = 3
[profile.wasm-release.package.sary-color]
opt-level = 3
[profile.wasm-release.package.sary-cms]
opt-level = "z"
[profile.wasm-release.package.sary-compose]
opt-level = "z"
[profile.wasm-release.package.sary-algo]
opt-level = "z"
[profile.wasm-release.package.sary-paint]
opt-level = 3


# Android release: whole-program LTO and no symbols, for the smallest .so.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
# Android backends through mahay-android (system document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }
