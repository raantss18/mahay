[package]
name = "sary-android"
description = "Sary on Android (phone and tablet): the eframe app inside MahayActivity."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# No `[lints] workspace = true`: `android_main` must be `#[unsafe(no_mangle)]`.

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
sary-doc = { workspace = true }
sary-color = { workspace = true }
sary-raster = { workspace = true }
sary-geom = { workspace = true }
sary-compose = { workspace = true }
sary-engine = { workspace = true }
sary-codecs = { workspace = true }
sary-io = { workspace = true }
sary-format = { workspace = true }
sary-automation = { workspace = true }
sary-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "accesskit", "persistence", "android-game-activity"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
arboard = { version = "3.6" }
open = "5"
ron = "0.12"
mahay-android = { path = "../../../../libs/core/crates/android", features = ["egui"] }
