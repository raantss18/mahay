[book]
authors = ["Sary contributors"]
language = "en"
multilingual = false
src = "src"
title = "Sary Documentation"

[build]
build-dir = "output"
create-missing = false

[output.html]
git-repository-icon = "fa-github"
git-repository-url = "https://github.com/raantss18/mahay"
edit-url-template = "https://github.com/raantss18/mahay/edit/main/book/{path}"
preferred-dark-theme = "navy"
smart-punctuation = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
