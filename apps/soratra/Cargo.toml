[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/soratra", "apps/soratra-cli", "xtask"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
# internal
soratra-geom = { path = "crates/geom" }
soratra-doc = { path = "crates/doc" }
soratra-fonts = { path = "crates/fonts" }
soratra-layout = { path = "crates/layout" }
soratra-docx = { path = "crates/docx" }
soratra-docbin = { path = "crates/docbin" }
soratra-formats = { path = "crates/formats" }
soratra-render = { path = "crates/render" }
soratra-pdf = { path = "crates/pdf" }
soratra-proof = { path = "crates/proof" }
soratra-engine = { path = "crates/engine" }
soratra-mcp = { path = "crates/mcp" }
soratra-zotero = { path = "crates/zotero" }
soratra-control-key = { path = "crates/control-key" }
soratra-ui-egui = { path = "crates/ui-egui" }
soratra-metafile = { path = "crates/metafile" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
wuff = "0.2.9"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
mahay-pdf = { path = "../../libs/core/crates/pdf", version = "=0.1.0", default-features = false, features = ["write"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
miniz_oxide = "0.8"
cfb = "0.15"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause) and its
# detector chardetng (Apache-2.0 OR MIT), both pure Rust (Firefox's).
encoding_rs = "0.8"
chardetng = "1"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Required by mahay-pdf: the backend rejects writers that failed during unwinding.
[patch.crates-io]
# Adds an Android backend (Storage Access Framework through mahay-android); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
# Adds an Android text backend through mahay-android; desktop unchanged.
arboard = { path = "../../libs/core/vendor/arboard" }
krilla = { path = "../../libs/core/vendor/krilla" }

# Android release: whole-program LTO and no symbols, for the smallest .so.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# Size first (about a quarter smaller than opt-level 3); hot loops stay at 3 below.
opt-level = "s"

[profile.android.package.soratra-layout]
opt-level = 3

[profile.android.package.soratra-render]
opt-level = 3
