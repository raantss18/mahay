[package]
name = "soratra-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Soratra rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
soratra-geom = { workspace = true }
soratra-doc = { workspace = true }
soratra-fonts = { workspace = true }
soratra-layout = { workspace = true }
soratra-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
