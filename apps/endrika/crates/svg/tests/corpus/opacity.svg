<svg xmlns="http://www.w3.org/2000/svg" width="100" height="200">
  <!-- Group opacity composites the group once; fill-opacity applies per shape. -->
  <g id="faded" opacity="0.5">
    <rect width="60" height="60" fill="#ff0000"/>
    <rect x="20" y="20" width="60" height="60" fill="#0000ff"/>
  </g>
  <rect y="100" width="60" height="60" fill="#ff0000" fill-opacity="0.5"/>
  <rect x="20" y="120" width="60" height="60" fill="#0000ff" fill-opacity="0.5"/>
  <!-- probe 10 10 #ff000080 -->
  <!-- probe 40 40 #0000ff80 -->
  <!-- probe 10 110 #ff000080 -->
  <!-- probe 40 140 #5500aabf -->
</svg>
