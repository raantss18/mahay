<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60">
  <!-- currentColor, named, hsl(), rgba(), #rgba, transparent, percentages, a named colour in style. -->
  <g color="#ff8000"><rect width="20" height="20" fill="currentColor"/></g>
  <rect x="20" width="20" height="20" fill="darkorchid"/>
  <rect x="40" width="20" height="20" fill="hsl(120, 100%, 25%)"/>
  <rect x="60" width="20" height="20" fill="rgba(0, 0, 255, 0.5)"/>
  <rect x="80" width="20" height="20" fill="#0f08"/>
  <rect y="30" width="20" height="20" fill="transparent"/>
  <rect x="20" y="30" width="20" height="20" fill="rgb(100%, 0%, 50%)"/>
  <rect x="40" y="30" width="20" height="20" style="fill: CornflowerBlue"/>
  <!-- probe 10 10 #ff8000ff -->
  <!-- probe 30 10 #9932ccff -->
  <!-- probe 50 10 #008000ff ~2 -->
  <!-- probe 70 10 #0000ff80 -->
  <!-- probe 90 10 #00ff0088 -->
  <!-- probe 10 40 #00000000 -->
  <!-- probe 30 40 #ff0080ff ~2 -->
  <!-- probe 50 40 #6495edff -->
</svg>
