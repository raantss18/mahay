[package]
name = "tsilo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Tsilo command line: MCP server (stdio) and headless batch runs"

[[bin]]
name = "tsilo-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tsilo-color = { workspace = true }
tsilo-doc = { workspace = true }
tsilo-engine = { workspace = true }
tsilo-format = { workspace = true }
tsilo-geom = { workspace = true }
tsilo-svg = { workspace = true }
tsilo-mcp = { workspace = true }
tsilo-render = { workspace = true }
tsilo-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# `perf` on Windows (src/perf.rs) reads how busy the processors are (GetSystemTimes) and this
# process's working set (GetProcessMemoryInfo) through winsafe's safe wrappers over Win32 (MIT),
# which the desktop app's src/gpu.rs also uses.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel", "psapi"] }

# DirectWrite's system font collection (the desktop app's src/system_fonts.rs, shared): fonts that
# font services such as Adobe Fonts load in place (#579). MIT OR Apache-2.0.
[target.'cfg(all(windows, not(target_vendor = "win7")))'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

# CoreText's font manager (the desktop app's src/mac_fonts.rs, shared): fonts that apps and font
# managers register from their own folders (#579). Zlib OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }

[dev-dependencies]
tsilo-testkit = { workspace = true }
serde_json = { workspace = true }
