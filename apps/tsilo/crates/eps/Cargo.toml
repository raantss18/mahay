[package]
name = "tsilo-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsilo Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
tsilo-geom = { workspace = true }
tsilo-color = { workspace = true }
tsilo-doc = { workspace = true }
tsilo-effects = { workspace = true }
tsilo-brush = { workspace = true }
tsilo-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
tsilo-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
tsilo-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
tsilo-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
# Images read through `CCITTFaxDecode`.
hayro-ccitt = { workspace = true }
# Live effects' params, as the art styles that name them give them.
serde_json = { workspace = true }

[dev-dependencies]
tsilo-testkit = { workspace = true }
# Tests: a Group 4 encoder and the T.4 run codes, to write CCITT test images.
fax = "0.2"
