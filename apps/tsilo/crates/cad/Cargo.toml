[package]
name = "tsilo-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsilo CAD interchange: a hand-written ASCII DXF writer (R12 to 2018)"

[lints]
workspace = true

[dependencies]
tsilo-geom = { workspace = true }
tsilo-color = { workspace = true }
tsilo-doc = { workspace = true }
tsilo-effects = { workspace = true }
tsilo-brush = { workspace = true }
tsilo-pathops = { workspace = true }
tsilo-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
tsilo-text = { workspace = true, features = ["bundled-fonts"] }
