[package]
name = "tsilo-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsilo Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
tsilo-geom = { workspace = true }
tsilo-color = { workspace = true }
tsilo-doc = { workspace = true }
tsilo-effects = { workspace = true }
tsilo-brush = { workspace = true }
tsilo-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
tsilo-text = { workspace = true, features = ["bundled-fonts"] }
