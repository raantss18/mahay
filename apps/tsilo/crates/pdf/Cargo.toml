[package]
name = "tsilo-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tsilo PDF export and import"

[lints]
workspace = true

[dependencies]
tsilo-geom = { workspace = true }
tsilo-doc = { workspace = true }
tsilo-effects = { workspace = true }
tsilo-brush = { workspace = true }
tsilo-color = { workspace = true }
tsilo-text = { workspace = true }
skrifa = { workspace = true }
kurbo = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
image = { workspace = true }
# CMYK JPEGs (the image crate writes RGB and grey ones only).
jpeg-encoder = { workspace = true }
mahay-pdf = { workspace = true }
log = { workspace = true }
smallvec = "1"
weezl = "0.1"
serde = { workspace = true }
# The XMP packet that File Info is read from (file_info.rs); the version usvg already uses.
roxmltree = "0.21"
# PDF security (encrypt.rs): pure Rust, MIT OR Apache-2.0, builds for wasm.
aes = "0.8"
md-5 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
tsilo-testkit = { workspace = true }
# A variable font built in code (no font file is committed).
tsilo-text = { workspace = true, features = ["test-fonts"] }
serde_json = { workspace = true }
# `draw_text`, to write test files with live text as other writers do.
krilla = { workspace = true, features = ["simple-text"] }
