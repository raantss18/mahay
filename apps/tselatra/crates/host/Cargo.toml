[package]
name = "tselatra-host"
description = "Builds a fully wired Tselatra session: media decoding (Hetsika codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tselatra-engine = { workspace = true }
tselatra-project = { workspace = true }
log = { workspace = true }
tselatra-media = { workspace = true }
tselatra-expr = { workspace = true }
tselatra-script = { workspace = true }
tselatra-export = { workspace = true }
tselatra-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tselatra-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
tselatra-psd = { workspace = true }
tselatra-svg = { workspace = true }
tselatra-pdf = { workspace = true }
tselatra-raster = { workspace = true }
tselatra-time = { workspace = true }
tselatra-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
