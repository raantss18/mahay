[package]
name = "tselatra-script"
description = "Tselatra scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tselatra-engine = { workspace = true }
tselatra-project = { workspace = true }
tselatra-keyframe = { workspace = true }
tselatra-time = { workspace = true }
tselatra-render = { workspace = true }
tselatra-path = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }
web-time = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
tselatra-expr = { workspace = true }
tselatra-psd = { workspace = true }
