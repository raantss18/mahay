[package]
name = "tselatra-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tselatra-time = { workspace = true }
tselatra-geom = { workspace = true }
tselatra-keyframe = { workspace = true }
serde_json = { workspace = true }
tselatra-project = { workspace = true }
tselatra-path = { workspace = true }
tselatra-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
tselatra-color = { workspace = true }
tselatra-effects = { workspace = true }
tselatra-text = { workspace = true }
