[package]
name = "tselatra-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tselatra-time = { workspace = true }
tselatra-geom = { workspace = true }
tselatra-color = { workspace = true }
tselatra-keyframe = { workspace = true }
tselatra-project = { workspace = true }
tselatra-raster = { workspace = true }
tselatra-path = { workspace = true }
tselatra-text = { workspace = true }
tselatra-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
tselatra-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
