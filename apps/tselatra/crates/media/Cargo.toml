[package]
name = "tselatra-media"
description = "Footage import: probing, stills, image sequences, video and audio via Hetsika's pure-Rust codecs, memory-budgeted frame cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mahay-docpath = { workspace = true }
tselatra-time = { workspace = true }
tselatra-project = { workspace = true }
tselatra-raster = { workspace = true }
tselatra-render = { workspace = true }
tselatra-psd = { workspace = true }
tselatra-svg = { workspace = true }
tselatra-pdf = { workspace = true }
tselatra-model = { workspace = true }
hetsika-codecs = { workspace = true }
hetsika-media = { workspace = true }
hetsika-isobmff = { workspace = true }
hetsika-frame = { workspace = true }
hetsika-color = { workspace = true }
hetsika-time = { workspace = true }
# AIFF import (#1428): enables the aiff reader of hetsika-codecs' symphonia.
symphonia = { workspace = true }
exr = { workspace = true }
gif = { workspace = true }
image = { workspace = true, features = ["gif", "webp", "tiff", "bmp", "exr", "tga", "hdr"] }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
