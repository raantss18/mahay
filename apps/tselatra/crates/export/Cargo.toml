[package]
name = "tselatra-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via Hetsika, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via Tselatra encoders, PNG/JPEG/TIFF/EXR sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tselatra-time = { workspace = true }
tselatra-project = { workspace = true }
tselatra-raster = { workspace = true }
tselatra-render = { workspace = true }
hetsika-h264enc = { workspace = true }
hetsika-prores = { workspace = true }
hetsika-aac = { workspace = true }
hetsika-isobmff = { workspace = true }
tselatra-opusenc = { workspace = true }
tselatra-vp9enc = { workspace = true }
tselatra-hevcenc = { workspace = true }
tselatra-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr"] }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tselatra-media = { workspace = true }
tselatra-effects = { workspace = true }
tselatra-color = { workspace = true }
hetsika-opus = { workspace = true }
hetsika-vp9 = { workspace = true }
tselatra-keyframe = { workspace = true }
