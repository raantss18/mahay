[package]
name = "tselatra-ui-egui"
description = "The Tselatra egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mahay-about = { path = "../../../../libs/core/crates/about" }
mahay-ui = { workspace = true }
tselatra-time = { workspace = true }
tselatra-geom = { workspace = true }
tselatra-color = { workspace = true }
tselatra-keyframe = { workspace = true }
tselatra-project = { workspace = true }
tselatra-path = { workspace = true }
tselatra-text = { workspace = true }
tselatra-render = { workspace = true }
tselatra-engine = { workspace = true }
tselatra-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
tselatra-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
