[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/raantss18/mahay"

[workspace.dependencies]
mahay-pdf = { path = "../../libs/core/crates/pdf", version = "=0.1.0", default-features = false, features = ["read"] }
mahay-docpath = { path = "../../libs/core/crates/docpath", version = "0.1.0" }
# internal
tselatra-time = { path = "crates/time" }
tselatra-geom = { path = "crates/geom" }
tselatra-color = { path = "crates/color" }
tselatra-raster = { path = "crates/raster" }
tselatra-path = { path = "crates/path" }
tselatra-keyframe = { path = "crates/keyframe" }
tselatra-project = { path = "crates/project" }
tselatra-text = { path = "crates/text" }
tselatra-effects = { path = "crates/effects" }
tselatra-track = { path = "crates/track" }
tselatra-segment = { path = "crates/segment" }
tselatra-model = { path = "crates/model" }
tselatra-render = { path = "crates/render" }
tselatra-gpu = { path = "crates/gpu" }
tselatra-media = { path = "crates/media" }
tselatra-export = { path = "crates/export" }
tselatra-expr = { path = "crates/expr" }
tselatra-lottie = { path = "crates/lottie" }
tselatra-interchange = { path = "crates/interchange" }
tselatra-pdf = { path = "crates/pdf" }
tselatra-psd = { path = "crates/psd" }
tselatra-vp9enc = { path = "crates/vp9enc" }
tselatra-svg = { path = "crates/svg" }
tselatra-engine = { path = "crates/engine" }
tselatra-host = { path = "crates/host" }
tselatra-ui-egui = { path = "crates/ui-egui" }
tselatra-automation = { path = "crates/automation" }
tselatra-opusenc = { path = "crates/opusenc" }
tselatra-script = { path = "crates/script" }
tselatra-hevcenc = { path = "crates/hevcenc" }
tselatra-av1enc = { path = "crates/av1enc" }
tselatra-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# media codecs + containers: Hetsika's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
hetsika-codecs = { path = "../hetsika/crates/codecs" }
hetsika-media = { path = "../hetsika/crates/media" }
hetsika-frame = { path = "../hetsika/crates/frame" }
hetsika-color = { path = "../hetsika/crates/color" }
hetsika-time = { path = "../hetsika/crates/time" }
# encoders + muxer (crates/export)
hetsika-h264enc = { path = "../hetsika/crates/h264enc" }
hetsika-prores = { path = "../hetsika/crates/prores" }
hetsika-aac = { path = "../hetsika/crates/aac" }
hetsika-isobmff = { path = "../hetsika/crates/isobmff" }
# decoder used as the round-trip oracle of tselatra-opusenc (crates/export dev-dependency)
hetsika-opus = { path = "../hetsika/crates/opus" }
hetsika-vp9 = { path = "../hetsika/crates/vp9" }
# decoders used as the round-trip oracles of tselatra-hevcenc / tselatra-av1enc (dev-dependencies only)
hetsika-hevc = { path = "../hetsika/crates/hevc" }
hetsika-av1 = { path = "../hetsika/crates/av1" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
hetsika-interchange = { path = "../hetsika/crates/interchange" }
hetsika-project = { path = "../hetsika/crates/project" }
hetsika-geom = { path = "../hetsika/crates/geom" }
# The symphonia hetsika-codecs already builds, named only to turn on its AIFF reader: the pinned
# rev enables wav alone (Hetsika main enables aiff too). Drop it when the pin moves past that.
symphonia = { version = "0.5.5", default-features = false, features = ["aiff"] }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
mahay-ui = { path = "../../libs/core/crates/ui", version = "0.1.0", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a Hetsika checkout next to this repo: uncomment.
# [patch."https://github.com/raantss18/mahay"]
# hetsika-codecs = { path = "../hetsika/crates/codecs" }
# hetsika-media = { path = "../hetsika/crates/media" }
# hetsika-frame = { path = "../hetsika/crates/frame" }
# hetsika-color = { path = "../hetsika/crates/color" }
# hetsika-time = { path = "../hetsika/crates/time" }
# hetsika-h264enc = { path = "../hetsika/crates/h264enc" }
# hetsika-prores = { path = "../hetsika/crates/prores" }
# hetsika-aac = { path = "../hetsika/crates/aac" }
# hetsika-isobmff = { path = "../hetsika/crates/isobmff" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.tselatra-raster]
opt-level = 3

[profile.dev.package.tselatra-render]
opt-level = 3

[profile.dev.package.tselatra-gpu]
opt-level = 3

[profile.dev.package.tselatra-effects]
opt-level = 3

[profile.dev.package.tselatra-track]
opt-level = 3

[profile.dev.package.tselatra-path]
opt-level = 3

[profile.dev.package.tselatra-media]
opt-level = 3

[profile.dev.package.tselatra-opusenc]
opt-level = 3

[profile.dev.package.tselatra-export]
opt-level = 3

[profile.dev.package.tselatra-vp9enc]
opt-level = 3

[profile.dev.package.tselatra-hevcenc]
opt-level = 3

[profile.dev.package.tselatra-av1enc]
opt-level = 3

# Hetsika codec hot loops (same settings as Hetsika's own workspace).
[profile.dev.package.hetsika-h264]
opt-level = 3

[profile.dev.package.hetsika-h264enc]
opt-level = 3

[profile.dev.package.hetsika-hevc]
opt-level = 3

[profile.dev.package.hetsika-vp9]
opt-level = 3

[profile.dev.package.hetsika-prores]
opt-level = 3

[profile.dev.package.hetsika-dnx]
opt-level = 3

[profile.dev.package.hetsika-av1]
opt-level = 3

[profile.dev.package.hetsika-aac]
opt-level = 3

[profile.dev.package.hetsika-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# Android backends through mahay-android (document picker, clipboard); desktop unchanged.
rfd = { path = "../../libs/core/vendor/rfd" }
arboard = { path = "../../libs/core/vendor/arboard" }
hayro-syntax = { path = "../../libs/core/vendor/hayro-syntax", version = "=0.7.2" }

# Android release: size first, whole-program LTO, no symbols.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
